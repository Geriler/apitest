<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Макетка</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
<style>
  :root {
    --paper: #f5f6f3;
    --paper-2: #eaece7;
    --ink: #1d2426;
    --muted: #5b686b;
    --line: #d3d9d6;
    --copper: #b0612a;
    --copper-soft: #f3e2d4;
    --ok: #2c8a57;
    --warn: #b87708;
    --danger: #c0392b;
    --danger-soft: #f8dcd7;
    --shadow: 0 1px 2px rgba(20, 30, 32, 0.12), 0 8px 24px rgba(20, 30, 32, 0.16);
    --stage: #2b3a3e;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #1b2123;
      --paper-2: #242c2f;
      --ink: #e5eae8;
      --muted: #97a4a6;
      --line: #334044;
      --copper: #e0955c;
      --copper-soft: #3b2a1f;
      --ok: #52b97f;
      --warn: #e0a53a;
      --danger: #ef6b5b;
      --danger-soft: #45231f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #1b2123;
    --paper-2: #242c2f;
    --ink: #e5eae8;
    --muted: #97a4a6;
    --line: #334044;
    --copper: #e0955c;
    --copper-soft: #3b2a1f;
    --ok: #52b97f;
    --warn: #e0a53a;
    --danger: #ef6b5b;
    --danger-soft: #45231f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 28px rgba(0, 0, 0, 0.45);
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--stage);
    color: var(--ink);
    font: 14px/1.45 var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: relative; height: 100%; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .panel {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }

  /* ── Инструменты ─────────────────────────────── */
  #tools {
    position: absolute;
    top: 16px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px;
    width: 196px;
  }
  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 2px 6px 8px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 4px;
  }
  .brand b { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  /* Заголовок — кнопка, раскрывающая список инструментов (по умолчанию он скрыт) */
  button.brand { width: 100%; background: none; border: 0; border-radius: 7px; color: inherit; font: inherit; cursor: pointer; gap: 8px; align-items: center; }
  button.brand:hover { background: var(--paper-2); }
  #tools:not(.open) button.brand { border-bottom: 0; margin-bottom: 0; padding-bottom: 2px; }
  .brand-tool { margin-left: auto; font: 500 12px var(--sans); color: var(--copper); }
  .brand-chev { font-size: 12px; color: var(--muted); transition: transform 0.15s; }
  #tools.open .brand-chev { transform: rotate(180deg); }
  #tools-list { display: flex; flex-direction: column; gap: 2px; }
  #tools-list[hidden] { display: none; }
  .tools-meta { padding: 0 8px 4px; font: 500 11px var(--mono); color: var(--muted); }
  .tool {
    display: grid;
    grid-template-columns: 30px 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: none;
    color: inherit;
    font: 500 13px var(--sans);
    text-align: left;
    cursor: pointer;
  }
  .tool svg { width: 30px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .tool kbd { font: 500 11px var(--mono); color: var(--muted); }
  .tool:hover { background: var(--paper-2); }
  .tool[aria-pressed="true"] { background: var(--copper-soft); border-color: var(--copper); color: var(--ink); }
  .tool[aria-pressed="true"] svg { stroke: var(--copper); }
  .tool:focus-visible, .btn:focus-visible, select:focus-visible { outline: 2px solid var(--copper); outline-offset: 1px; }
  .tool-sep { height: 1px; background: var(--line); margin: 4px 2px; }
  /* Группы инструментов: заголовок, по щелчку справа выпадает список */
  .group { position: relative; }
  .group > summary, .menu > summary { list-style: none; }
  .group > summary::-webkit-details-marker, .menu > summary::-webkit-details-marker { display: none; }
  .group-head .chev { font: 500 16px var(--sans); color: var(--muted); line-height: 1; }
  .group[open] > .group-head { background: var(--paper-2); }
  .group-head.active { background: var(--copper-soft); border-color: var(--copper); }
  .group-head.active svg { stroke: var(--copper); }
  .group-body {
    position: absolute;
    left: calc(100% + 14px);
    top: -8px;
    width: 220px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    z-index: 5;
  }

  /* ── Действия ────────────────────────────────── */
  #actions {
    position: absolute;
    top: 16px;
    left: 228px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--paper);
    color: var(--ink);
    font: 500 13px var(--sans);
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .btn:hover { border-color: var(--copper); }
  .btn.inline { box-shadow: none; padding: 5px 10px; }
  .btn.danger { color: var(--danger); }
  .btn[aria-pressed="true"] { background: var(--copper-soft); border-color: var(--copper); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  /* ── Принципиальная схема ── */
  #schematic {
    position: absolute;
    left: 228px;
    bottom: 16px;
    width: min(640px, calc(100% - 228px - 348px));
    min-width: 280px;
    height: 44%;
    display: flex;
    flex-direction: column;
    padding: 8px 10px 10px 12px;
    resize: both;
    overflow: hidden;
  }
  #schematic[hidden] { display: none; }
  .sch-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .sch-head small { color: var(--muted); font-size: 11px; }
  .sch-body { flex: 1; overflow: auto; }
  .sch { display: block; }
  /* По размеру панели (не крупнее натуральной величины); кнопка «100 %» — в натуральную с прокруткой */
  #schematic:not(.actual) .sch { max-width: 100%; max-height: 100%; width: auto; height: auto; }
  #schematic:not(.actual) .sch-body { overflow: hidden; }
  .sch path, .sch rect, .sch circle { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
  .sch .dot, .sch .fill { fill: var(--ink); stroke: none; }
  .sch .thin { stroke-width: 1.1; }
  .sch .thick { stroke-width: 3; }
  /* Подложка цвета фона под текстом: линии не перечёркивают подписи */
  .sch text { fill: var(--ink); stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; paint-order: stroke; font: 500 10.5px var(--mono); }
  .sch .nethit { stroke: transparent; stroke-width: 12; cursor: ns-resize; }
  .sch .net:hover path:not(.nethit) { stroke: var(--copper); }
  .sch .part { cursor: ew-resize; }
  .sch text.ref { fill: var(--copper); font-weight: 600; }
  .sch text.sub, .sch text.volt { fill: var(--muted); }
  .sch .hit { fill: transparent; stroke: none; pointer-events: all; }
  .sch .part:hover :is(path, rect:not(.hit), circle:not(.dot, .fill)), .sch .part.sel :is(path, rect:not(.hit), circle:not(.dot, .fill)) { stroke: var(--copper); }
  .sch .part:hover :is(.dot, .fill), .sch .part.sel :is(.dot, .fill) { fill: var(--copper); }
  .sch .part.sel path { stroke-width: 2; }
  /* Меню «Настройки» */
  .menu { position: relative; }
  .menu > summary { display: block; }
  .menu[open] > summary { border-color: var(--copper); }
  .menu-body {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 210px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
  }
  .menu-body .btn { box-shadow: none; text-align: left; }
  .btn:disabled:hover { border-color: var(--line); }
  .kv.actual span:last-child { color: var(--copper); }
  select.btn { width: auto; max-width: 170px; font: 500 13px var(--sans); background: var(--paper); }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatch {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--line);
    cursor: pointer;
    padding: 0;
    font: 600 11px var(--mono);
    color: #fff;
  }
  .swatch.auto { background: conic-gradient(#c8261f 0 50%, #1b1d20 50% 100%); }
  .swatch[aria-pressed="true"] { outline: 2px solid var(--copper); outline-offset: 2px; }
  .swatch:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }

  /* ── Инспектор ───────────────────────────────── */
  #inspector {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 300px;
    max-height: calc(100% - 96px);
    overflow: auto;
    padding: 14px 16px 16px;
  }
  .eyebrow { font: 600 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .ref { font: 600 13px var(--mono); color: var(--copper); }
  #inspector h2 { margin: 2px 0 2px; font-size: 18px; font-weight: 600; text-wrap: balance; }
  #inspector p { margin: 6px 0; color: var(--muted); }
  #inspector .sub { color: var(--muted); font-size: 13px; }
  .readout {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    margin: 12px 0;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 7px;
    overflow: hidden;
  }
  .readout div { background: var(--paper-2); padding: 7px 8px; }
  .readout dt { font: 600 10px var(--mono); letter-spacing: 0.08em; color: var(--muted); }
  .readout dd { margin: 2px 0 0; font: 500 14px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter { height: 6px; border-radius: 3px; background: var(--paper-2); border: 1px solid var(--line); overflow: hidden; margin: 6px 0 2px; }
  .meter i { display: block; height: 100%; background: var(--ok); }
  .meter.warn i { background: var(--warn); }
  .meter.bad i { background: var(--danger); }
  .kv { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 3px 0; }
  .kv span:first-child { color: var(--muted); }
  .kv span:last-child { font-family: var(--mono); text-align: right; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font: 600 11px var(--mono); letter-spacing: 0.04em; border: 1px solid; }
  .pill.ok { color: var(--ok); }
  .pill.warn { color: var(--warn); }
  .pill.bad { color: var(--danger); background: var(--danger-soft); }
  .bands { display: flex; gap: 3px; align-items: center; margin: 8px 0 4px; }
  .bands i { width: 14px; height: 22px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.25); }
  .bands .body { width: auto; height: 22px; padding: 0 6px; display: flex; align-items: center; gap: 4px; background: #d8c496; border-radius: 11px; border: 1px solid rgba(0,0,0,0.2); }
  .smd-chip { display: inline-block; margin: 8px 0 4px; padding: 3px 12px; background: #15171a; color: #e9e6dc; font: 600 16px var(--mono); border-left: 6px solid #b8bcc2; border-right: 6px solid #b8bcc2; }
  .field { display: grid; gap: 4px; margin: 10px 0; }
  .field label { font-size: 12px; color: var(--muted); }
  select {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper-2);
    color: var(--ink);
    font: 500 13px var(--mono);
  }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .list { margin: 8px 0 0; padding: 0; list-style: none; }
  .list li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .list li span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .list.projects li { align-items: center; }
  .list.projects .row { margin-top: 0; flex-wrap: nowrap; }
  .list.projects li span:last-child { font-family: inherit; flex: 0 0 auto; }
  .list.projects small { color: var(--muted); font-size: 12px; }
  #inspector input[type="text"] { width: 100%; box-sizing: border-box; font: 500 13px var(--sans); cursor: text; text-align: left; box-shadow: none; }
  .help { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .help b { color: var(--ink); font-weight: 600; }

  /* ── Подсказка и уведомления ─────────────────── */
  #hint {
    position: absolute;
    left: 50%;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    max-width: min(640px, calc(100% - 32px));
    padding: 8px 14px;
    font-size: 13px;
    text-align: center;
  }
  #hint b { color: var(--copper); font-weight: 600; }
  #toasts {
    position: absolute;
    left: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: min(320px, calc(100% - 32px));
    pointer-events: none;
  }
  .toast { padding: 10px 12px; border-left: 4px solid var(--danger); font-size: 13px; animation: in 0.2s ease-out; }
  .toast b { display: block; }
  @keyframes in { from { transform: translateY(6px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

  /* ── Телефон ─────────────────────────────────── */
  @media (max-width: 760px) {
    #tools {
      top: auto;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      left: 16px;
      right: 16px;
      width: auto;
      flex-direction: row;
      overflow-x: auto;
      padding: 6px;
    }
    .tool-sep, .tool kbd, .group-head .chev, .tools-meta { display: none; }
    /* Внизу кнопка, список раскрывается над ней полосой */
    #tools { flex-direction: column-reverse; overflow: visible; right: auto; }
    #tools.open { right: 16px; }
    button.brand { border: 0; margin: 0; padding: 4px 8px; }
    #tools-list { flex-direction: row; overflow-x: auto; }
    /* Список группы — полосой над панелью инструментов */
    .group-body {
      position: fixed;
      left: 16px;
      right: 16px;
      top: auto;
      bottom: calc(84px + env(safe-area-inset-bottom, 0px));
      width: auto;
      flex-direction: row;
      overflow-x: auto;
      padding: 6px;
    }
    .menu-body { position: fixed; top: 56px; left: auto; right: 16px; }
    #schematic { left: 16px; right: 16px; width: auto; min-width: 0; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); height: 40%; resize: none; }
    .sch-head small { display: none; }
    .tool { grid-template-columns: 1fr; justify-items: center; gap: 2px; font-size: 11px; padding: 4px 6px; flex: 0 0 auto; }
    /* Одна строка с прокруткой: иначе кнопки переносятся и наезжают на уведомления */
    #actions { left: 16px; right: 16px; top: 12px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
    #actions .btn { padding: 6px 10px; font-size: 12px; flex: 0 0 auto; box-shadow: none; }
    #inspector {
      top: auto;
      right: 16px;
      left: 16px;
      width: auto;
      bottom: calc(86px + env(safe-area-inset-bottom, 0px));
      max-height: 34%;
      padding: 10px 12px;
    }
    #hint { top: 56px; bottom: auto; font-size: 12px; }
    #toasts { bottom: auto; top: 56px; left: 16px; }
    #app:has(#toasts .toast) #hint { visibility: hidden; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>

  <nav id="tools" class="panel" aria-label="Инструменты">
    <button class="brand" id="tools-toggle" aria-expanded="false" aria-controls="tools-list" title="Инструменты (горячие клавиши работают и без списка)">
      <b>Макетка</b><span class="brand-tool">Выбор</span><span class="brand-chev" aria-hidden="true">▾</span>
    </button>
    <div id="tools-list" hidden>
    <div class="tools-meta"><span class="brand-points">400 точек</span></div>
    <button class="tool" data-tool="select" aria-pressed="true" title="Выбор, перемещение, тумблеры">
      <svg viewBox="0 0 30 18"><path d="M11 3l9 6-4 1 3 5-2 1-3-5-3 3z" /></svg>Выбор<kbd>1</kbd>
    </button>
    <details class="group" data-group="links">
      <summary class="tool group-head" title="Соединения"><svg viewBox="0 0 30 18"><circle cx="4" cy="9" r="2" /><path d="M6 9h18" /><circle cx="26" cy="9" r="2" /></svg><span class="gname">Соединения</span><span class="chev" aria-hidden="true">›</span></summary>
      <div class="group-body panel">
        <button class="tool" data-tool="wire" aria-pressed="false" title="Провод между отверстиями и выводами">
          <svg viewBox="0 0 30 18"><circle cx="4" cy="9" r="2" /><path d="M6 9h18" /><circle cx="26" cy="9" r="2" /></svg>Провод<kbd>2</kbd>
        </button>
        <button class="tool" data-tool="trace" aria-pressed="false" title="Медная дорожка на печатной плате">
          <svg viewBox="0 0 30 18"><circle cx="4" cy="13" r="2.4" /><path d="M6.4 13h6l5-8h6" stroke-width="2.4" /><circle cx="25.5" cy="5" r="2.4" /></svg>Дорожка<kbd>T</kbd>
        </button>
      </div>
    </details>
    <details class="group" data-group="boards">
      <summary class="tool group-head" title="Платы"><svg viewBox="0 0 30 18"><rect x="2" y="2" width="26" height="14" rx="1" /><path d="M5 5h20M5 13h20" stroke-dasharray="1.5 2" /><path d="M2 9h26" stroke-width="0.8" /></svg><span class="gname">Платы</span><span class="chev" aria-hidden="true">›</span></summary>
      <div class="group-body panel">
        <button class="tool" data-tool="bb" aria-pressed="false" title="Положить на стол макетку на 400 точек">
          <svg viewBox="0 0 30 18"><rect x="2" y="2" width="26" height="14" rx="1" /><path d="M5 5h20M5 13h20" stroke-dasharray="1.5 2" /><path d="M2 9h26" stroke-width="0.8" /></svg>Макетка<kbd>B</kbd>
        </button>
        <button class="tool" data-tool="pcb" aria-pressed="false" title="Положить на стол печатную плату">
          <svg viewBox="0 0 30 18"><rect x="2" y="2" width="26" height="14" rx="1" /><circle cx="8" cy="9" r="1.6" /><circle cx="15" cy="9" r="1.6" /><circle cx="22" cy="9" r="1.6" /></svg>Печатная плата<kbd>V</kbd>
        </button>
      </div>
    </details>
    <details class="group" data-group="passive">
      <summary class="tool group-head" title="Пассивные"><svg viewBox="0 0 30 18"><path d="M1 9h7M22 9h7" /><rect x="8" y="5" width="14" height="8" /></svg><span class="gname">Пассивные</span><span class="chev" aria-hidden="true">›</span></summary>
      <div class="group-body panel">
        <button class="tool" data-tool="tht" aria-pressed="false" title="Выводной резистор 0,125–2 Вт">
          <svg viewBox="0 0 30 18"><path d="M1 9h7M22 9h7" /><rect x="8" y="5" width="14" height="8" /></svg>Резистор<kbd>3</kbd>
        </button>
        <button class="tool" data-tool="cap" aria-pressed="false" title="Конденсатор: электролитический или керамический">
          <svg viewBox="0 0 30 18"><path d="M1 9h11M18 9h11M12 3v12M18 3v12" /></svg>Конденсатор<kbd>4</kbd>
        </button>
      </div>
    </details>
    <details class="group" data-group="semi">
      <summary class="tool group-head" title="Полупроводники"><svg viewBox="0 0 30 18"><path d="M1 9h10M19 9h10M11 4l8 5-8 5zM19 4v10" /></svg><span class="gname">Полупроводники</span><span class="chev" aria-hidden="true">›</span></summary>
      <div class="group-body panel">
        <button class="tool" data-tool="diode" aria-pressed="false" title="Диод 1N4148 / 1N4007 / 1N5408">
          <svg viewBox="0 0 30 18"><path d="M1 9h10M19 9h10M11 4l8 5-8 5zM19 4v10" /></svg>Диод<kbd>5</kbd>
        </button>
        <button class="tool" data-tool="led" aria-pressed="false" title="Светодиод 5 мм или мощный 1 Вт">
          <svg viewBox="0 0 30 18"><path d="M1 11h8M17 11h12M9 6l8 5-8 5zM17 6v10M18 4l4-3M20 6l4-3" /></svg>Светодиод<kbd>6</kbd>
        </button>
        <button class="tool" data-tool="bjt" aria-pressed="false" title="Транзистор BC547 / BC557: встаёт в три соседних столбца">
          <svg viewBox="0 0 30 18"><circle cx="16" cy="9" r="7.5" /><path d="M4 9h8M12 4.5v9M12 7l6-4.5M12 11l6 4.5M16.5 14.5l1.8 1 -0.4-2" /></svg>Транзистор<kbd>0</kbd>
        </button>
        <button class="tool" data-tool="fet" aria-pressed="false" title="Полевой транзистор (MOSFET): 2N7000, BS250, IRLZ44N, IRF9540N">
          <svg viewBox="0 0 30 18"><circle cx="16" cy="9" r="7.5" /><path d="M4 13h7M11 4v10M13.5 4v2.5M13.5 7.8v2.4M13.5 11.5v2.5M13.5 5.2h5V2M13.5 12.8h5V16M13.5 9h5v3.8M15 9l2-1.2v2.4z" /></svg>MOSFET<kbd>M</kbd>
        </button>
      </div>
    </details>
    <details class="group" data-group="load">
      <summary class="tool group-head" title="Лампа и тумблер"><svg viewBox="0 0 30 18"><path d="M1 9h8M21 9h8" /><circle cx="15" cy="9" r="6" /><path d="M11 5l8 8M19 5l-8 8" /></svg><span class="gname">Лампа и тумблер</span><span class="chev" aria-hidden="true">›</span></summary>
      <div class="group-body panel">
        <button class="tool" data-tool="lamp" aria-pressed="false" title="Лампа накаливания">
          <svg viewBox="0 0 30 18"><path d="M1 9h8M21 9h8" /><circle cx="15" cy="9" r="6" /><path d="M11 5l8 8M19 5l-8 8" /></svg>Лампа<kbd>7</kbd>
        </button>
        <button class="tool" data-tool="switch" aria-pressed="false" title="Тумблер">
          <svg viewBox="0 0 30 18"><path d="M1 12h8l12-7M21 12h8" /></svg>Тумблер<kbd>8</kbd>
        </button>
      </div>
    </details>
    <details class="group" data-group="power">
      <summary class="tool group-head" title="Питание"><svg viewBox="0 0 30 18"><path d="M1 9h11M18 9h11M12 3v12M18 6v6" /></svg><span class="gname">Питание</span><span class="chev" aria-hidden="true">›</span></summary>
      <div class="group-body panel">
        <button class="tool" data-tool="battery" aria-pressed="false" title="Батарея (ставится на стол)">
          <svg viewBox="0 0 30 18"><path d="M1 9h11M18 9h11M12 3v12M18 6v6" /></svg>Батарея<kbd>9</kbd>
        </button>
        <button class="tool" data-tool="psu" aria-pressed="false" title="Лабораторный блок питания 0–30 В, 0–3 А">
          <svg viewBox="0 0 30 18"><rect x="5" y="2" width="20" height="14" rx="1.5" /><path d="M8 5h9v4H8zM20 12.5h1M23 12.5h0" /><circle cx="10" cy="12.5" r="1.5" /></svg>Блок питания<kbd>P</kbd>
        </button>
      </div>
    </details>
    <div class="tool-sep"></div>
    <button class="tool" data-tool="delete" aria-pressed="false" title="Удалить деталь или провод">
      <svg viewBox="0 0 30 18"><path d="M10 4l10 10M20 4L10 14" /></svg>Удалить<kbd>Del</kbd>
    </button>
    </div>
  </nav>

  <div id="actions">
    <select class="btn" id="demo-select" aria-label="Загрузить пример">
      <option value="" selected>Примеры…</option>
      <option value="lamps">Лампы и перегрев резистора</option>
      <option value="leds">Конденсатор и светодиоды</option>
      <option value="blinker">Мигалка на транзисторах</option>
      <option value="mosfet">MOSFET: ключ и память затвора</option>
      <option value="pcb">Печатная плата и блок питания</option>
    </select>
    <button class="btn" id="btn-undo" title="Отменить (Ctrl+Z)" aria-label="Отменить" disabled>↶</button>
    <button class="btn" id="btn-redo" title="Вернуть (Ctrl+Y)" aria-label="Вернуть" disabled>↷</button>
    <button class="btn" id="btn-clear">Очистить</button>
    <button class="btn" id="btn-schematic" aria-pressed="false" title="Принципиальная схема сборки">Схема</button>
    <button class="btn" id="btn-projects" aria-pressed="false" title="Сохранить, открыть, скачать файлом">Проекты</button>
    <details class="menu" id="settings-menu">
      <summary class="btn" title="Допуски, ток, замена сгоревших">Настройки</summary>
      <div class="menu-body panel">
        <button class="btn" id="btn-tol" aria-pressed="false" title="Разброс параметров, как у настоящих деталей">Допуски: выкл.</button>
        <button class="btn" id="btn-reroll" hidden title="Те же номиналы, другие экземпляры деталей">Другие экземпляры</button>
        <button class="btn" id="btn-current" aria-pressed="true" title="Бегущие точки тока на проводах и дорожках">Ток: вкл.</button>
        <button class="btn" id="btn-repair">Заменить сгоревшие</button>
      </div>
    </details>
    <button class="btn" id="btn-help" aria-pressed="false" title="Сводка по схеме и подсказки" aria-label="Подсказки">?</button>
  </div>

  <aside id="inspector" class="panel" aria-live="polite"></aside>

  <section id="schematic" class="panel" hidden aria-label="Принципиальная схема">
    <div class="sch-head">
      <span><span class="eyebrow">схема</span> <small>детали и линии цепей можно двигать мышью; щелчок по детали — её панель</small></span>
      <span class="row" style="margin: 0; flex-wrap: nowrap;">
        <button class="btn inline" id="btn-sch-reset" hidden title="Вернуть автоматическую раскладку">Сбросить</button>
        <button class="btn inline" id="btn-sch-zoom" aria-pressed="false" title="Натуральная величина с прокруткой или по размеру панели">100 %</button>
        <button class="btn inline" id="btn-sch-close" aria-label="Закрыть схему" title="Закрыть">×</button>
      </span>
    </div>
    <div class="sch-body"></div>
  </section>
  <div id="hint" class="panel" hidden></div>
  <div id="toasts"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
